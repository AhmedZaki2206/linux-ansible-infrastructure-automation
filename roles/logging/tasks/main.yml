---
- name: Configure logrotate for health-check logs
  ansible.builtin.template:
    src: ansible-lab-health.j2
    dest: /etc/logrotate.d/ansible-lab-health
    owner: root
    group: root
    mode: "0644"

- name: Install health-check systemd service
  ansible.builtin.template:
    src: ansible-lab-health.service.j2
    dest: /etc/systemd/system/ansible-lab-health.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Install health-check systemd timer
  ansible.builtin.template:
    src: ansible-lab-health.timer.j2
    dest: /etc/systemd/system/ansible-lab-health.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Flush systemd handler
  ansible.builtin.meta: flush_handlers

- name: Enable health-check timer
  ansible.builtin.systemd_service:
    name: ansible-lab-health.timer
    enabled: true
    state: started

