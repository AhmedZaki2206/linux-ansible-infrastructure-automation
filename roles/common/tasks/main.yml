---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install baseline packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Upgrade installed packages when explicitly requested
  ansible.builtin.apt:
    upgrade: safe
  when: common_upgrade_packages | bool

- name: Set system timezone
  community.general.timezone:
    name: "{{ common_timezone }}"

- name: Configure unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: Deploy system health check
  ansible.builtin.template:
    src: health-check.sh.j2
    dest: /usr/local/sbin/ansible-lab-health
    owner: root
    group: root
    mode: "0755"

