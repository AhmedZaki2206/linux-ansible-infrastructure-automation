        web01:
          ansible_host: 192.168.56.11
    app_servers:
      hosts:
        app01:
          ansible_host: 192.168.56.12
    ops_servers:
      hosts:
        ops01:
          ansible_host: 192.168.56.13
    lab_servers:
      children:
        web_servers:
        app_servers:
        ops_servers:

