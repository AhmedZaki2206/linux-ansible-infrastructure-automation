---
all:
  vars:
    ansible_host: 127.0.0.1
    ansible_user: ansible
    ansible_ssh_private_key_file: "{{ lookup('env', 'HOME') }}/.ssh/ansible_lab_ed25519"
    ansible_python_interpreter: /usr/bin/python3
  children:
    container_servers:
      hosts:
        web01-container:
          ansible_port: 2221
        app01-container:
          ansible_port: 2222
        ops01-container:
          ansible_port: 2223

